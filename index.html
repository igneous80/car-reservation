
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06C755">

  <title>Car Booking System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      color: #333;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    #status {
      padding: 12px;
      background: #f3f5f5;
      border-radius: 8px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #06C755;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h1>Car Booking System</h1>
  <p>Company Vehicle Booking</p>

  <p id="status" role="status" aria-live="polite">
    Loading LIFF SDK...
  </p>

  <button id="loginButton" type="button" disabled>
    Log in with LINE
  </button>

  <div style="margin-top: 20px;">
    <button id="profileButton" type="button" disabled>
      Test LINE Profile
    </button>
    <p id="profileStatus">Profile not tested.</p>
  </div>

  <div style="margin-top: 20px;">
    <button id="employeeProfileButton" type="button">
      Test Employee Profile
    </button>
    <button id="adminAccessButton" type="button">
      Test Admin Access
    </button>
    <button id="unlinkedEmployeesButton" type="button">
      Get Unlinked Employees
    </button>
    <button id="identityButton" type="button" disabled>
      Test LINE ID Token
    </button>
    <p id="identityStatus">Identity not tested.</p>
  </div>

  <script>
    const LIFF_ID = '2012254902-rJe96Xlf';

    const statusElement = document.getElementById('status');
    const loginButton = document.getElementById('loginButton');
    const profileButton = document.getElementById('profileButton');
    const profileStatus = document.getElementById('profileStatus');
    const identityButton = document.getElementById('identityButton');
    const identityStatus = document.getElementById('identityStatus');
    const employeeProfileButton = document.getElementById('employeeProfileButton');
    const adminAccessButton = document.getElementById('adminAccessButton');
    const unlinkedEmployeesButton = document.getElementById('unlinkedEmployeesButton');
    
    let liffReady = false;

    function showError(message) {
      statusElement.textContent = 'ERROR: ' + message;
      console.error(message);
    }

    function showLiffStatus() {
      const context = liff.getContext();

      statusElement.textContent =
        'LIFF initialized successfully.' +
        '\ninClient: ' + liff.isInClient() +
        '\ncontext: ' + (context ? context.type : 'unknown') +
        '\nloggedIn: ' + liff.isLoggedIn() +
        '\nSDK: ' + liff.getVersion() +
        '\nHost: ' + window.location.hostname +
        '\nPath: ' + window.location.pathname;

      loginButton.textContent = liff.isLoggedIn()
        ? 'Already logged in with LINE'
        : 'Log in with LINE';

      loginButton.disabled = false;
      profileButton.disabled = !liff.isLoggedIn();
      identityButton.disabled = !liff.isLoggedIn();
    }

    async function initializeLiff() {
      statusElement.textContent = 'Loading LIFF SDK...';

      if (typeof window.liff === 'undefined') {
        showError(
          'LIFF SDK was not loaded. Check your internet connection ' +
          'or whether the LINE SDK CDN is blocked.'
        );
        return;
      }

      statusElement.textContent = 'Initializing LIFF...';

      try {
        await liff.init({
          liffId: LIFF_ID
        });

        liffReady = true;
        showLiffStatus();

      } catch (error) {
        console.error('LIFF initialization failed:', error);

        showError(
          (error && error.message)
            ? error.message
            : String(error)
        );
      }
    }

    async function loginWithLine() {
      if (!liffReady) {
        showError('LIFF is not ready yet. Please reload the page.');
        return;
      }

      if (liff.isLoggedIn()) {
        showLiffStatus();
        return;
      }

      try {
        liff.login({
          redirectUri: window.location.href
        });
      } catch (error) {
        showError(
          (error && error.message)
            ? error.message
            : String(error)
        );
      }
    }

    async function testLineProfile() {
      profileButton.disabled = true;
      profileStatus.textContent = 'Loading LINE profile...';

    try {
      if (!liff.isLoggedIn()) {
        throw new Error('Please log in with LINE first.');
      }

      const profile = await liff.getProfile();

      profileStatus.textContent =
        'Profile loaded successfully.' +
        '\nDisplay name: ' + profile.displayName +
        '\nPicture available: ' + Boolean(profile.pictureUrl) +
        '\nUser ID: ' + profile.userId;

    } catch (error) {
      console.error('LINE profile test failed:', error);

      profileStatus.textContent =
        'Profile test failed: ' +
        (error && error.message ? error.message : String(error));

    } finally {
    profileButton.disabled = !liff.isLoggedIn();
    }
  }

    
    async function testLineIdentity() {
      identityButton.disabled = true;
      identityStatus.textContent = 'Verifying LINE identity...';

      try {
        if (!liffReady || !liff.isLoggedIn()) {
          throw new Error('Please log in with LINE first.');
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            'No LINE ID Token available. Please log in again.'
          );
        }

        const response = await fetch(
          'https://car-booking-api.akanee-so.workers.dev/',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              action: 'testIdentity',
              idToken: idToken
            })
          }
        );

        const result = await response.json();

        if (!response.ok || result.ok !== true) {
          throw new Error(
            result.message || 'LINE identity verification failed.'
          );
        }

        identityStatus.textContent =
          'LINE ID Token verified successfully.';

      } catch (error) {
        console.error('LINE identity test failed:', error);

        identityStatus.textContent =
          'Identity test failed: ' +
          (error && error.message
            ? error.message
            : String(error));

      } finally {
        identityButton.disabled = !liffReady || !liff.isLoggedIn();
      }
    }

    async function testMyProfile() {
      identityButton.disabled = true;
      identityStatus.textContent = 'Loading employee profile...';

    try {
      if (!liffReady || !liff.isLoggedIn()) {
        throw new Error('Please log in with LINE first.');
      }

    const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error(
        'No LINE ID Token available. Please log in again.'
      );
      }

    const response = await fetch(
      'https://car-booking-api.akanee-so.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'getMyProfile',
          idToken: idToken
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.ok !== true) {
      throw new Error(
        result.message || 'Failed to load employee profile.'
      );
    }

    identityStatus.textContent =
      'Employee profile loaded successfully.' +
      '\nBooker ID: ' + result.employee.bookerId +
      '\nName: ' + result.employee.bookerName +
      '\nDepartment: ' + result.employee.department +
      '\nRole: ' + result.employee.role;

  } catch (error) {
    console.error('Employee profile test failed:', error);

    identityStatus.textContent =
      'Employee profile test failed: ' +
      (error && error.message
        ? error.message
        : String(error));

  } finally {
    identityButton.disabled = !liffReady || !liff.isLoggedIn();
  }
}    
async function testAdminAccess() {
  adminAccessButton.disabled = true;
  identityStatus.textContent = 'Checking administrator access...';

  try {
    if (!liffReady || !liff.isLoggedIn()) {
      throw new Error('Please log in with LINE first.');
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error('No LINE ID Token available. Please log in again.');
    }

    const response = await fetch(
      'https://car-booking-api.akanee-so.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'testAdminAccess',
          idToken: idToken
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.ok !== true) {
      throw new Error(result.message || 'Administrator access denied.');
    }

    identityStatus.textContent =
      'Administrator access verified successfully.';

  } catch (error) {
    console.error('Admin access test failed:', error);

    identityStatus.textContent =
      'Admin access test failed: ' +
      (error && error.message ? error.message : String(error));

  } finally {
    adminAccessButton.disabled = !liffReady || !liff.isLoggedIn();
  }
}


async function testUnlinkedEmployees() {
  unlinkedEmployeesButton.disabled = true;
  identityStatus.textContent = 'Loading unlinked employees...';

  try {
    if (!liffReady || !liff.isLoggedIn()) {
      throw new Error('Please log in with LINE first.');
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error('No LINE ID Token available. Please log in again.');
    }

    const response = await fetch(
      'https://car-booking-api.akanee-so.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'getUnlinkedEmployees',
          idToken: idToken
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.ok !== true) {
      throw new Error(
        result.message || 'Unable to load unlinked employees.'
      );
    }

    const employees = result.employees || [];

    identityStatus.textContent =
      'Unlinked employees loaded successfully.\n' +
      'Total: ' + employees.length + '\n\n' +
      employees.map((employee, index) =>
        (index + 1) + '. ' +
        employee.bookerId + ' - ' +
        employee.bookerName + ' (' +
        employee.department + ')'
      ).join('\n');

  } catch (error) {
    console.error('Unlinked employees test failed:', error);

    identityStatus.textContent =
      'Unlinked employees test failed: ' +
      (error && error.message ? error.message : String(error));

  } finally {
    unlinkedEmployeesButton.disabled =
      !liffReady || !liff.isLoggedIn();
  }
}

    unlinkedEmployeesButton.addEventListener('click',testUnlinkedEmployees);
    
    adminAccessButton.addEventListener('click', testAdminAccess);
    
    identityButton.addEventListener('click', testLineIdentity);

    employeeProfileButton.addEventListener('click', testMyProfile);
    
    profileButton.addEventListener('click', testLineProfile);
    
    loginButton.addEventListener('click', loginWithLine);

    const sdkScript = document.createElement('script');

    sdkScript.src =
      'https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js';

    sdkScript.onload = initializeLiff;

    sdkScript.onerror = function () {
      showError(
        'Failed to download LIFF SDK version 2.31.2. ' +
        'Check network access to static.line-scdn.net.'
      );
    };

    document.head.appendChild(sdkScript);
  </script>
</body>
</html>
